<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2: Nombres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Formulario de Nombres</h2>

        <form method="POST" action="{{ url_for('ejercicio2') }}">
            <label for="nombre1">Nombre 1:</label>
            <input type="text" id="nombre1" name="nombre1" required><br>

            <label for="nombre2">Nombre 2:</label>
            <input type="text" id="nombre2" name="nombre2" required><br>

            <label for="nombre3">Nombre 3:</label>
            <input type="text" id="nombre3" name="nombre3" required><br>

            <button type="submit">Enviar</button>
        </form>

        {% if resultado_nombre %}
            <div class="resultado">
                <p>{{ resultado_nombre }}</p>
                <p>{{ resultado_caracteres }}</p>
            </div>
        {% endif %}

        <p><a href="{{ url_for('index') }}">Volver al Menú</a></p>
    </div>
</body>
</html>
