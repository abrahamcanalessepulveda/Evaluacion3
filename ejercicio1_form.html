<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1: Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Formulario de Notas</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('ejercicio1') }}">
            <label for="nota1">Nota 1 (10-70):</label>
            <input type="number" id="nota1" name="nota1" required min="10" max="70"><br>

            <label for="nota2">Nota 2 (10-70):</label>
            <input type="number" id="nota2" name="nota2" required min="10" max="70"><br>

            <label for="nota3">Nota 3 (10-70):</label>
            <input type="number" id="nota3" name="nota3" required min="10" max="70"><br>

            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia" required min="0" max="100"><br>

            <button type="submit">Enviar</button>
        </form>

        {% if promedio %}
            <div class="resultado">
                <p>{{ promedio }}</p>
                <p class="{{ 'aprobado' if estado == 'APROBADO' else 'reprobado' }}">{{ estado }}</p>
            </div>
        {% endif %}

        <p><a href="{{ url_for('index') }}">Volver al Menú</a></p>
    </div>
</body>
</html>
